<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CUIMS Clear</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="product-header">
        <div class="mark" aria-hidden="true"><span>//</span></div>
        <div class="product-name">
          <p class="eyebrow">Student utility</p>
          <h1>CUIMS Clear</h1>
        </div>
        <span class="version">v0.7.0</span>
      </header>

      <div id="access-banner" class="access-banner" role="alert" hidden>
        <p>Firefox has switched off CUIMS Clear on CUIMS and LMS, so it only runs when you click it.</p>
        <button id="grant-access" type="button">Allow access</button>
      </div>

      <nav class="open-nav" aria-label="Open portals">
        <a class="open-link" href="https://students.cuchd.in/StudentHome.aspx" target="_blank" rel="noreferrer">
          <span>Open CUIMS</span><span aria-hidden="true">↗</span>
        </a>
        <a class="open-link lms-open-link" href="https://students.cuchd.in/StudentHome.aspx#cuims-clear-lms" target="_blank" rel="noreferrer">
          <span>Open LMS</span><span aria-hidden="true">↗</span>
        </a>
      </nav>

      <div class="view-tabs" role="tablist" aria-label="Sections">
        <button id="tab-login" type="button" role="tab" aria-selected="true" aria-controls="view-login">Login</button>
        <button id="tab-attendance" type="button" role="tab" aria-selected="false" aria-controls="view-attendance" tabindex="-1">Attendance</button>
      </div>

      <div id="view-login" role="tabpanel" aria-labelledby="tab-login">
      <form id="settings-form">
        <fieldset class="login-fields">
          <legend>Saved login</legend>

          <label for="uid">Student UID</label>
          <input
            id="uid"
            name="uid"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            maxlength="15"
          />

          <label for="password">CUIMS password</label>
          <div class="password-field">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="off"
              aria-describedby="storage-note"
            />
            <button id="toggle-password" class="field-action" type="button" aria-label="Show password">
              Show
            </button>
          </div>
        </fieldset>

        <fieldset class="settings-group">
          <legend>Login</legend>
          <label class="check-row">
            <span>
              <strong>Move past UID</strong>
              <small>Presses Next after filling it</small>
            </span>
            <input id="auto-advance" type="checkbox" />
          </label>

          <label class="check-row">
            <span>
              <strong>Solve CAPTCHA automatically</strong>
              <small>Reads the code on-device, retries safely</small>
            </span>
            <input id="auto-solve-captcha" type="checkbox" />
          </label>

          <label class="check-row">
            <span>
              <strong>Submit login automatically</strong>
              <small>Fills captcha and presses Login when the read looks valid</small>
            </span>
            <input id="auto-submit-login" type="checkbox" />
          </label>
        </fieldset>

        <fieldset class="settings-group">
          <legend>Quiet mode</legend>
          <label class="check-row">
            <span>
              <strong>Event interruptions</strong>
              <small>Hide promotional dialogs</small>
            </span>
            <input id="block-events" type="checkbox" />
          </label>

          <label class="check-row">
            <span>
              <strong>Feedback interruptions</strong>
              <small>Hide survey and rating dialogs</small>
            </span>
            <input id="block-feedback" type="checkbox" />
          </label>
        </fieldset>

        <button id="save-button" class="save-button" type="submit">Save changes</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <section class="local-data" aria-labelledby="local-data-title">
        <div>
          <h2 id="local-data-title">Local by design</h2>
          <p id="storage-note">Your login and attendance stay in this Firefox profile. CAPTCHA is solved on-device.</p>
        </div>
        <button id="clear-login" class="clear-button" type="button">Clear login</button>
      </section>
      </div>

      <section id="view-attendance" class="attendance" role="tabpanel" aria-labelledby="tab-attendance" hidden></section>
    </main>
    <script src="attendance-model.js"></script>
    <script src="attendance-view.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
